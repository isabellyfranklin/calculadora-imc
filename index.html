<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="esilos/style.css">
</head>
<body>
    <h1>Calculadora IMC</h1>
    
    <main>
       
        <div class="corpo-calc">
            <div class="campo">
                <label for="altura">Altura  (m)</label>
                <input type="number" id="altura" required placeholder="Ex: 1.65 ou 165" >
            </div>
            <div class="campo">
                <label for="peso">Peso (kg)</label>
                <input type="number" id="peso" required placeholder="Ex: 60" >
            </div>

            <div class="botoes">
                <div class="botao01">
                    <button id="calculador" onclick="calcular()">Calcular</button>
                </div>
                <div class="botao02">
                    <button onclick="limpar()">Limpar</button>
                </div>
            </div>
             <output id="resultado">Seu IMC é: </output>
        </div>
    </main>



    <script src="calculo.js"></script>
</body>
</html>
