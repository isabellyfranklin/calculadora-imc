<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="esilos/style.css">
</head>
<body>
    <h1>Calculadora IMC</h1>
    
    <main>
       
        <div class="corpo-calc">
            <div class="campo">
                <label for="altura"><div class="letras-label">Altura  (m)</div></label>
                <input type="number" id="altura" required placeholder="Ex: 1.65 ou 165" >
            </div>
            <div class="campo">
                <label for="peso"><div class="letras-label">Peso (kg)</div></label>
                <input type="number" id="peso" required placeholder="Ex: 60" >
            </div>

            <div class="botoes">
                <div class="botao01">
                    <button id="calculador" onclick="calcular()"><div class="letras-botoes">Calcular</div></button>
                </div>
                <div class="botao02">
                    <button onclick="limpar()"><div class="letras-botoes">Limpar</div></button>
                </div>
            </div>
             <output id="resultado"><div class="letra-resultado">Seu IMC é: </div></output>
        </div>
    </main>



    <script src="calculo.js"></script>
</body>
</html>
