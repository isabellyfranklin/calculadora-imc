<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>

    
    <link rel="stylesheet" href="css/mobile.css" media="screen and (max-width: 764px)">

    <link rel="stylesheet" href="css/tablet.css" media="screen and (min-width: 765px) and (max-width: 1223px)">

    <link rel="stylesheet" href="css/style.css" media="screen and (min-width: 1224px) and (max-width: 1920px)">
    
<body>

    <div class="botaoDarkElight">
        <div class="trilho" id="trilho">
            <div class="indicador"></div>
        </div>
    </div>

    <h1>Calculadora IMC</h1>

    <main>
       
        <div class="corpo-calc">
            <div class="campo">
                <label for="altura" class="letras-label">Altura  (m)</label>
                <input type="number" id="altura" required placeholder="Ex: 1.65 ou 165" >
            </div>
            <div class="campo">
                <label for="peso" class="letras-label">Peso (kg)</label>
                <input type="number" id="peso" required placeholder="Ex: 60" >
            </div>

            <div class="botoes">
                <div class="botao01">
                    <button id="calculador" onclick="calcular()" class="letras-botoes">Calcular</button>
                </div>
                <div class="botao02">
                    <button onclick="limpar()" class="letras-botoes">Limpar</button>
                </div>
            </div>
             <output id="resultado"><div class="letra-resultado">Seu IMC é: </div></output>
        </div>
    </main>



    <script src="js/calculo.js"></script>
</body>
</html>
